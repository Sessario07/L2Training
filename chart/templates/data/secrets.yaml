{{/*
Secret delivery from AWS Secrets Manager.

There are no passwords in this chart or in git. Terraform generates them into
Secrets Manager; the Secrets Store CSI driver mounts them as files into only
the pods entitled to see them.

The chain, and every link that can break:
  SecretProviderClass  names the AWS secret and which fields to extract
  ServiceAccount       carries eks.amazonaws.com/role-arn   (IRSA)
  IAM trust policy     pins system:serviceaccount:<ns>:<name>
  IAM role policy      grants GetSecretValue on THAT secret only
  pod volumeMount      files appear under /mnt/secrets
  container            reads <VAR>_FILE

The ARNs used to be six hardcoded strings across three files. They are derived
now, so renaming the project cannot silently produce AccessDenied at runtime.
*/}}
{{- $ns := include "l2lab.appNs" . }}
{{- range $sa := list "app" "worker" "postgres" "backup" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    eks.amazonaws.com/role-arn: {{ include "l2lab.roleArn" (list $ (ternary "backup" "app-secrets" (eq $sa "backup"))) }}
  labels:
    {{- include "l2lab.labels" $ | nindent 4 }}
---
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "l2lab.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    # `objects` is a YAML-formatted STRING, not a structured field. That is
    # the upstream API, awkward as it looks.
    objects: |
      - objectName: "{{ include "l2lab.secretId" (list . "postgres") }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "postgres-password"
          - path: "url"
            objectAlias: "postgres-url"
      - objectName: "{{ include "l2lab.secretId" (list . "postgres-monitor") }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "url"
            objectAlias: "postgres-monitor-url"
          - path: "password"
            objectAlias: "postgres-monitor-password"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backup
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "l2lab.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ include "l2lab.secretId" (list . "postgres") }}"
        objectType: "secretsmanager"
        jmesPath:
          - path: "password"
            objectAlias: "postgres-password"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: {{ include "l2lab.obsNs" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # A DIFFERENT role from the application's. Least privilege: a compromised
    # app pod cannot read Grafana's admin password, and vice versa.
    eks.amazonaws.com/role-arn: {{ include "l2lab.roleArn" (list . "grafana-secrets") }}
  labels:
    {{- include "l2lab.labels" . | nindent 4 }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana
  namespace: {{ include "l2lab.obsNs" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "l2lab.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ include "l2lab.secretId" (list . "grafana") }}"
        objectType: "secretsmanager"
        jmesPath:
          # The paths MUST be quoted. JMESPath parses a bare `admin-user` as
          # the subtraction expression `admin - user`, evaluates it to null,
          # and the provider then reports the useless "Failed to fetch secret
          # from all regions" - sending you hunting through IAM for a
          # permissions problem that does not exist. Any key with a hyphen
          # needs these quotes.
          - path: '"admin-user"'
            objectAlias: "admin-user"
          - path: '"admin-password"'
            objectAlias: "admin-password"
