{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: {{ include "l2lab.obsNs" . }}
data:
  alerts.yaml: |
    groups:
      # Recording rules pre-compute expensive queries so dashboards stay fast.
      - name: l2lab-recording
        interval: 30s
        rules:
          - record: app:http_request_rate5m
            expr: sum(rate(app_http_requests_total[5m])) by (route, status)

          - record: app:http_error_ratio5m
            expr: |
              sum(rate(app_http_requests_total{status="5xx"}[5m]))
                /
              clamp_min(sum(rate(app_http_requests_total[5m])), 0.001)

          - record: app:http_p99_latency5m
            expr: |
              histogram_quantile(0.99,
                sum(rate(app_http_request_duration_seconds_bucket[5m])) by (le, route))

      - name: l2lab-app
        rules:
          # The four "golden signal" style alerts for the application.
          - alert: HighErrorRate
            expr: app:http_error_ratio5m > 0.05
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "Over 5% of requests are returning 5xx"
              description: "Error ratio is {{`{{ $value | humanizePercentage }}`}} over the last 5 minutes."

          - alert: HighLatency
            expr: app:http_p99_latency5m > 1
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "p99 latency above 1s on {{`{{ $labels.route }}`}}"

          - alert: NoTrafficReceived
            expr: sum(rate(app_http_requests_total[5m])) == 0
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "The application is receiving no traffic at all"
              description: "Either nobody is using it, or the ALB has stopped routing here."

          - alert: WorkerFallingBehind
            expr: histogram_quantile(0.9, sum(rate(app_worker_lag_seconds_bucket[5m])) by (le)) > 30
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "Fan-out worker is more than 30s behind"
              description: "Timelines will be stale. The site is degraded, not down."

          - alert: CacheHitRatioCollapsed
            expr: |
              sum(rate(app_cache_events_total{result="hit"}[10m]))
                /
              clamp_min(sum(rate(app_cache_events_total{result=~"hit|miss"}[10m])), 0.001) < 0.2
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "Timeline cache hit ratio below 20%"
              description: "Every read is hitting Postgres. Often precedes a database overload."

      - name: l2lab-kubernetes
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 900 > 3
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} is crash looping"

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="false"} == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}} has been not-ready for 10m"

          - alert: ContainerCPUThrottling
            expr: |
              rate(container_cpu_cfs_throttled_seconds_total{container!=""}[5m]) > 0.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "{{`{{ $labels.pod }}`}} is being CPU throttled"
              description: "The CPU limit is too low. Latency will look like a slow app."

          - alert: ContainerMemoryNearLimit
            expr: |
              container_memory_working_set_bytes{container!=""}
                / on(container, pod, namespace)
              kube_pod_container_resource_limits{resource="memory"} > 0.9
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{`{{ $labels.pod }}`}} is within 10% of its memory limit"
              description: "An OOMKill is likely. Memory is not compressible."

          - alert: PersistentVolumeFillingUp
            expr: |
              kubelet_volume_stats_available_bytes
                / kubelet_volume_stats_capacity_bytes < 0.15
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "PVC {{`{{ $labels.persistentvolumeclaim }}`}} is over 85% full"

          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "Node {{`{{ $labels.node }}`}} is NotReady"
              description: "On spot instances this often means a reclaim is in progress."
{{- end }}
