{{- if .Values.observability.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ include "l2lab.obsNs" . }}
  labels: { app: tempo }
spec:
  selector: { app: tempo }
  ports:
    - { name: http,      port: 3200, targetPort: 3200 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
  namespace: {{ include "l2lab.obsNs" . }}
spec:
  serviceName: tempo
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
      annotations:
        # Tempo exposes its own metrics; scrape them so you can tell the
        # difference between "no traces arriving" and "Tempo is dropping them".
        prometheus.io/scrape: "true"
        prometheus.io/port: "3200"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tempo
          image: {{ .Values.observability.tempo.image }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: http,      containerPort: 3200 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data,   mountPath: /var/tempo }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: tempo-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass }}
        resources:
          requests: { storage: {{ .Values.observability.tempo.storage }} }
{{- end }}
