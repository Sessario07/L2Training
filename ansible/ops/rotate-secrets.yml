---
# Rotate the generated passwords.
#
#   ansible-playbook ops/rotate-secrets.yml -e target=grafana -e confirm=yes
#   ansible-playbook ops/rotate-secrets.yml -e target=postgres -e confirm=yes
#
# Secret rotation is one of those tasks that is trivially easy right up until
# you discover the ordering matters. Read the notes below before running the
# postgres one.

- name: Rotate a secret
  hosts: localhost
  gather_facts: false

  vars:
    confirm: "no"
    target: ""

  tasks:
    - name: Validate arguments
      ansible.builtin.assert:
        that:
          - target in ['grafana', 'postgres']
          - confirm | string | lower in ['yes', 'true']
        fail_msg: |
          Usage: -e target=grafana|postgres -e confirm=yes

    - name: Generate a new password
      ansible.builtin.set_fact:
        # 32 characters from a set that needs no escaping inside a Postgres
        # connection URI. Special characters in a DSN are a classic
        # self-inflicted outage.
        new_password: >-
          {{ lookup('community.general.random_string',
                    length=32, special=false, numbers=true,
                    upper=true, lower=true) }}

    # ------------------------------------------------------------- grafana
    - name: Rotate Grafana
      when: target == 'grafana'
      block:
        - name: Write the new value into Secrets Manager
          ansible.builtin.command:
            argv:
              - aws
              - secretsmanager
              - put-secret-value
              - --region
              - "{{ aws_region }}"
              - --secret-id
              - "{{ secret_grafana }}"
              - --secret-string
              - '{"admin-user":"admin","admin-password":"{{ new_password }}"}'
          changed_when: true
          no_log: true

        # The CSI driver polls every 60s (rotationPollInterval), so the file
        # would update on its own. Grafana only reads it at startup, though,
        # so it needs a restart to take effect.
        - name: Restart Grafana to pick up the new password
          ansible.builtin.command: >-
            kubectl -n {{ ns_obs }} rollout restart sts/grafana
          changed_when: true

        - name: Wait for the rollout
          ansible.builtin.command: >-
            kubectl -n {{ ns_obs }} rollout status sts/grafana --timeout=300s
          changed_when: false

    # ------------------------------------------------------------ postgres
    - name: Rotate PostgreSQL
      when: target == 'postgres'
      block:
        - name: Explain the ordering
          ansible.builtin.debug:
            msg:
              - "Postgres rotation has an ordering constraint:"
              - "  1. ALTER the role inside the running database"
              - "  2. THEN update Secrets Manager"
              - "  3. THEN restart the app so it re-reads the mounted file"
              - ""
              - "Doing 2 before 1 leaves the app holding a password the"
              - "database has never heard of, and every connection fails."
              - ""
              - "Note POSTGRES_PASSWORD only applies at initdb time, so"
              - "changing the secret alone does nothing to an existing volume."

        - name: Change the password inside PostgreSQL first
          kubernetes.core.k8s_exec:
            namespace: "{{ ns_app }}"
            pod: postgres-0
            command: >-
              psql -U l2lab -d l2lab -c
              "ALTER ROLE l2lab WITH PASSWORD '{{ new_password }}'"
          changed_when: true
          no_log: true

        - name: Now update Secrets Manager, including the derived DSN
          ansible.builtin.command:
            argv:
              - aws
              - secretsmanager
              - put-secret-value
              - --region
              - "{{ aws_region }}"
              - --secret-id
              - "{{ secret_postgres }}"
              - --secret-string
              - >-
                {"username":"l2lab","password":"{{ new_password }}",
                "database":"l2lab","host":"postgres.l2lab.svc.cluster.local",
                "port":"5432",
                "url":"postgres://l2lab:{{ new_password }}@postgres.l2lab.svc.cluster.local:5432/l2lab?sslmode=disable"}
          changed_when: true
          no_log: true

        - name: Restart the application so it re-reads the mounted secret
          ansible.builtin.command: >-
            kubectl -n {{ ns_app }} rollout restart deploy/{{ item }}
          loop: [app, worker]
          changed_when: true

        - name: Wait for the rollouts
          ansible.builtin.command: >-
            kubectl -n {{ ns_app }} rollout status deploy/{{ item }} --timeout=300s
          loop: [app, worker]
          changed_when: false

        - name: Confirm the application can still reach the database
          kubernetes.core.k8s_exec:
            namespace: "{{ ns_obs }}"
            pod: prometheus-0
            command: >-
              wget -qO- --timeout=5
              http://app.{{ ns_app }}.svc.cluster.local/readyz
          register: readyz
          changed_when: false

        - name: Assert the rotation did not break anything
          ansible.builtin.assert:
            that: (readyz.stdout | from_json).checks.postgres == "ok"
            fail_msg: "Rotation broke database connectivity: {{ readyz.stdout }}"
            success_msg: "Rotation complete, application still healthy"

    - name: Note
      ansible.builtin.debug:
        msg:
          - "{{ target }} password rotated."
          - "The new value was never printed. Retrieve it with:"
          - "  aws secretsmanager get-secret-value --region {{ aws_region }} \\"
          - "    --secret-id {{ project }}/{{ target }} --query SecretString --output text"
