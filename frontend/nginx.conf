# nginx serving the single-page app.
#
# It does NOT proxy to the API. The ALB does path-based routing:
#     /api/*  ->  the backend Service
#     /*      ->  this Service
# so the browser calls /api/... on the same origin and there is no CORS to
# configure and no proxy hop to debug.

worker_processes  auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access logs to stdout, so Alloy's JSON parser handles these exactly
    # like the backend's logs and they land in Loki with the same shape.
    log_format json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"level":"INFO",'
        '"service":"l2lab-frontend",'
        '"message":"http_request",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
    '}';
    access_log /dev/stdout json;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;   # do not advertise the nginx version

    # Everything nginx wants to write goes to /tmp, so the container can run
    # with a read-only root filesystem.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   256;

    server {
        # 8080, not 80: an unprivileged process cannot bind a port below 1024.
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Health endpoint for the ALB target group and the kubelet probes.
        # Excluded from the access log so probe traffic does not drown out
        # real requests in Loki.
        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","service":"frontend"}';
        }

        # The app is a single HTML file; any unknown path falls back to it so
        # deep links like /#/u/alice work on a hard refresh.
        location / {
            try_files $uri $uri/ /index.html;

            # index.html must never be cached, or users keep running an old
            # build after a deploy and you get bug reports for code that is no
            # longer running. Fingerprinted assets could be cached forever;
            # there are none here yet.
            add_header Cache-Control "no-store, must-revalidate";
        }

        # Basic hardening headers.
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
