# Attaches the IAM role to the controller's ServiceAccount. Without this
# annotation the controller starts fine, then fails every AWS call with
# AccessDenied - and the Ingress simply never produces an ALB, with the real
# reason buried in the controller's logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::134604498185:role/l2lab-sawibowo-aws-lbc
