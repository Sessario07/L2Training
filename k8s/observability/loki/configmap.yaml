apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    # Single-binary Loki backed by a local EBS volume.
    #
    # Production Loki splits into distributor/ingester/querier microservices
    # backed by S3. That is correct at scale and enormous overkill here - this
    # cluster produces a few MB of logs a day.
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 24h
      # Reject log lines with timestamps far in the past/future rather than
      # silently corrupting the index.
      reject_old_samples: true
      reject_old_samples_max_age: 12h
      # Guard rails. Loki's real enemy is high label cardinality: one label
      # with unbounded values (a request ID, a user ID) will destroy it.
      max_label_names_per_series: 20
      max_query_series: 1000
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      allow_structured_metadata: true
      volume_enabled: true

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    # No usage reporting from a lab cluster.
    analytics:
      reporting_enabled: false
