apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels: { app: grafana }
spec:
  selector: { app: grafana }
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: observability
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: /metrics
    spec:
      # NOTE on config changes: dashboards are re-read automatically every 30s
      # (see dashboards-provider.yaml). DATASOURCES are not - they are only
      # read at startup. After editing datasources.yaml you must run:
      #     kubectl -n observability rollout restart sts/grafana
      serviceAccountName: grafana
      securityContext:
        runAsUser: 472        # `grafana` in the official image
        runAsGroup: 472
        runAsNonRoot: true
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:12.4.1
          ports:
            - name: http
              containerPort: 3000
          env:
            # Grafana supports a "__FILE" suffix on any setting natively, so
            # the admin password is read from the CSI-mounted file and never
            # exists as an environment variable.
            - name: GF_SECURITY_ADMIN_USER__FILE
              value: /mnt/secrets/admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /mnt/secrets/admin-password
            # Must match the public URL, or OAuth redirects and shared links
            # come out pointing at localhost.
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.sawibowo.sandbox.devopsinstitute.id
            # Anonymous access is OFF. It was convenient, but this dashboard
            # is reachable from the public internet through the ALB, and an
            # open Grafana leaks the entire internal topology of the cluster.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Do not let a signed-in user be silently created by any proxy header.
            - name: GF_AUTH_BASIC_ENABLED
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Session cookies only travel over HTTPS (the ALB terminates TLS).
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: "lax"
            # Clickjacking protection.
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            # Enables the Explore view's trace-to-logs correlation UI.
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceToProfiles,traceqlEditor"
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashprovider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashprovider
          configMap: { name: grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: grafana
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests: { storage: 2Gi }
