apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: observability
  annotations:
    # A DIFFERENT role from the application's. Least privilege: a compromised
    # app pod cannot read Grafana's admin password, and vice versa.
    eks.amazonaws.com/role-arn: arn:aws:iam::134604498185:role/l2lab-sawibowo-grafana-secrets
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana
  namespace: observability
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "l2lab-sawibowo/grafana"
        objectType: "secretsmanager"
        jmesPath:
          # The paths MUST be quoted. JMESPath parses a bare `admin-user` as
          # the subtraction expression `admin - user`, evaluates it to null,
          # and the provider then reports the useless
          #   "Failed to fetch secret from all regions"
          # which sends you hunting through IAM for a permissions problem that
          # does not exist. Any key containing a hyphen needs these quotes.
          - path: '"admin-user"'
            objectAlias: "admin-user"
          - path: '"admin-password"'
            objectAlias: "admin-password"
