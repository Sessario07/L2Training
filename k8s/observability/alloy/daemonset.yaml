# A DaemonSet: exactly one Alloy pod per node, each collecting only the logs
# of pods scheduled on its own node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: observability
spec:
  selector:
    matchLabels: { app: alloy }
  template:
    metadata:
      labels: { app: alloy }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "12345"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsUser: 473          # `alloy` in the official image
        runAsGroup: 473
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alloy
          image: grafana/alloy:v1.12.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            # The config filters discovery down to this node using this value.
            # Without it, every Alloy pod would collect every pod's logs and
            # you would get N copies of every log line.
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          ports:
            - { name: http, containerPort: 12345 }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: tmp,    mountPath: /tmp/alloy }
          resources:
            requests: { cpu: 25m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: 12345 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: tmp
          emptyDir: {}
      tolerations:
        # Run on every node, including any that are tainted. A node you cannot
        # collect logs from is a blind spot during an incident.
        - operator: Exists
