# ---------------------------------------------------------------------------
# Secrets, delivered from AWS Secrets Manager.
#
# There are no passwords in this repository. Terraform generates them, stores
# them in Secrets Manager, and the Secrets Store CSI driver mounts them into a
# tmpfs volume inside only the pods entitled to see them.
#
# The chain, and every link in it that can break:
#
#   SecretProviderClass  names the AWS secret and which fields to extract
#         |
#   ServiceAccount       carries eks.amazonaws.com/role-arn   (IRSA)
#         |
#   IAM role trust       pins system:serviceaccount:<ns>:<name>
#         |
#   IAM role policy      grants GetSecretValue on THAT secret only
#         |
#   pod volumeMount      files appear under /mnt/secrets
#         |
#   container            reads <VAR>_FILE
#
# When a secret does not appear, walk that chain in order. It is almost always
# the trust policy, or a ServiceAccount name that does not match it.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: l2lab
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::134604498185:role/l2lab-sawibowo-app-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: l2lab
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::134604498185:role/l2lab-sawibowo-app-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: l2lab
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::134604498185:role/l2lab-sawibowo-app-secrets
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres
  namespace: l2lab
spec:
  provider: aws
  parameters:
    # `objects` is a YAML-formatted STRING, not a structured field. That is
    # the upstream API, awkward as it looks.
    objects: |
      - objectName: "l2lab-sawibowo/postgres"
        objectType: "secretsmanager"
        # jmesPath extracts individual JSON fields into their own files, so a
        # container only ever sees the single value it needs rather than the
        # whole credential blob.
        jmesPath:
          - path: "password"
            objectAlias: "postgres-password"
          - path: "url"
            objectAlias: "postgres-url"

      # Separate credential for the metrics exporter. Scoped to pg_monitor,
      # so a compromised metrics sidecar can read statistics views and nothing
      # else - the app role is a superuser and must not be reused here.
      - objectName: "l2lab-sawibowo/postgres-monitor"
        objectType: "secretsmanager"
        jmesPath:
          - path: "url"
            objectAlias: "postgres-monitor-url"
          - path: "password"
            objectAlias: "postgres-monitor-password"
